# Staging Self-Service Platform (all phases). Runs a tiny Go binary + embedded
# SQLite in one container. Mounts host resources READ-ONLY for discovery
# (docker.sock, /data/app, nginx sites) so it never changes staging by itself.
services:
  staging-platform:
    build: .
    image: staging-platform:latest
    container_name: staging-platform
    restart: unless-stopped
    ports:
      - "8088:8088"
    # Keep it light on an already-busy host. NOTE: the Go runtime inside the
    # container doesn't know about this cgroup quota (GOMAXPROCS defaults to
    # the host's full CPU count, e.g. 12). Whenever more than one goroutine
    # needs to run at once (background scan tick, a deploy's watcher
    # goroutine polling Jenkins, an SSE log stream, an incoming HTTP request),
    # the kernel CFS quota throttles the whole process until the next period -
    # this is what caused the occasional, unreproducible "stuck navigation"
    # (nothing is actually blocking in the app logic). cpus raised 0.5 -> 1.0
    # to give the scheduler real headroom, plus GOMAXPROCS=1 so Go itself
    # never tries to run more than the quota allows at once.
    mem_limit: 192m
    cpus: 1.0
    environment:
      - GOMAXPROCS=1
      # time.Local in Go follows the container's own TZ, not the browser's -
      # without this the container defaults to UTC and every displayed
      # timestamp (scan time, booking windows, deploy times) is off by the
      # local UTC offset (e.g. 7h behind for WIB).
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # host.docker.internal isn't automatic on Linux hosts; needed to reach
    # watersheep/fisherman's published ports for the /actuator/info version check.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Config (create config.json from config.example.json).
      - ./config.json:/app/config.json:ro
      # Persistent SQLite DB (users, sessions, bookings, deployments, audit).
      - ./data:/app/data
      # Read-only host inspection sources. NOTE: docker.sock must be mounted
      # read-write (not :ro) - connecting to it requires write access to the
      # socket file even for read-only commands like `docker ps`; the app
      # itself only ever calls read-only docker subcommands.
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/app:/data/app:ro                          # slot dirs + git + .env
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled:ro  # domain mapping
