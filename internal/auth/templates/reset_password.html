<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password — Staging Platform</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Set your password</h1>
    <p class="sub">{{if .Username}}Signed in as {{.Username}}. {{end}}You must set a new password before continuing.</p>

    {{if .Error}}<div class="banner error">{{.Error}}</div>{{end}}

    <form method="post" action="/reset-password" class="devform">
      <input type="password" name="new_password" placeholder="New password (min 8 characters)" autocomplete="new-password" required minlength="8">
      <input type="password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required minlength="8">
      <button type="submit" class="btn">Set password</button>
    </form>
    <p class="hint"><a class="navlink" href="/logout">Logout</a></p>
  </div>
</body>
</html>
