<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Staging Platform</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Staging Self-Service</h1>
    <p class="sub">Sign in to continue</p>

    {{if .Error}}<div class="banner error">{{.Error}}</div>{{end}}

    <form method="post" action="/auth/login" class="devform">
      <input type="text" name="username" placeholder="Username" autocomplete="username" required autofocus>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="btn">Sign in</button>
    </form>
    <p class="hint">Don't have an account? Ask an admin to create one on the Users page.</p>
  </div>
</body>
</html>
