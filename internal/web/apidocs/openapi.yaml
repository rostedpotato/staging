openapi: 3.0.3
info:
  title: Staging Platform API
  version: 1.0.0
  description: |
    Machine-facing, read-only API of the Staging Platform.

    ## Authentication
    Every request needs a static API key in the `Authorization` header:

    ```
    Authorization: Bearer <api key>
    ```

    Keys are issued by an administrator (they are configured on the server, one
    per consumer, each with a list of scopes). Browser login sessions are **not**
    accepted by this API.

    ## Times and time zones
    All timestamps are RFC3339 with an explicit offset, in the platform's booking
    time zone (WIB, `+07:00`). Query parameters accept either a full RFC3339
    timestamp or a plain date (`YYYY-MM-DD`), which is interpreted in WIB.
    Remember to percent-encode `+` as `%2B` in timestamps inside a query string.

    ## Errors
    Errors always have the same JSON shape and never redirect:
    `{"error": {"code": "...", "message": "..."}}`.

    ## Versioning
    Everything lives under `/api/v1`. New fields and new endpoints may be added
    to v1 at any time, so clients must ignore fields they do not know. Breaking
    changes would be published under `/api/v2`.
servers:
  - url: /
    description: This server
tags:
  - name: Bookings
    description: Environment (slot) reservations.
security:
  - bearerAuth: []
paths:
  /api/v1/bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List bookings in a time range
      description: |
        Returns every booking whose window **overlaps** the range `[from, to)`,
        i.e. `start < to` and `end > from`. A booking that started before `from`
        and is still running is therefore included.

        Results are ordered by booking start time (then id), so offset
        pagination is stable. Requires scope `bookings:read`.
      x-required-scope: bookings:read
      parameters:
        - name: from
          in: query
          required: true
          description: |
            Start of the range. `YYYY-MM-DD` means 00:00 WIB of that day;
            otherwise an RFC3339 timestamp.
          schema:
            type: string
          examples:
            date:
              summary: Date
              value: "2026-10-01"
            timestamp:
              summary: Timestamp (note %2B for +)
              value: "2026-10-01T08:00:00%2B07:00"
        - name: to
          in: query
          required: true
          description: |
            End of the range. A plain date **includes the whole day** (the range
            ends at 00:00 WIB of the next day). Must be after `from`, and at most
            366 days after it.
          schema:
            type: string
          examples:
            date:
              summary: Date
              value: "2026-10-31"
        - name: slot
          in: query
          required: false
          description: Only bookings of this environment (e.g. `development-04`).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Only bookings with this stored status.
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          description: Number of bookings to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of bookings (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
              example:
                data:
                  - id: 42
                    slot: development-04
                    username: brian
                    purpose: dev multiple zone gp
                    start: "2026-10-15T00:00:00+07:00"
                    end: "2026-10-22T23:59:59+07:00"
                    effectiveEnd: "2026-10-20T11:30:00+07:00"
                    status: released
                    createdAt: "2026-10-12T09:41:07+07:00"
                    releasedAt: "2026-10-20T11:30:00+07:00"
                meta:
                  from: "2026-10-01T00:00:00+07:00"
                  to: "2026-11-01T00:00:00+07:00"
                  limit: 100
                  offset: 0
                  total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static API key issued by an administrator.
  schemas:
    BookingStatus:
      type: string
      description: |
        - `active`: currently running or upcoming
        - `expired`: ran its full planned window
        - `released`: ended early by its owner
        - `overridden`: ended early by an administrator
      enum: [active, expired, released, overridden]
    Booking:
      type: object
      required: [id, slot, username, purpose, start, end, effectiveEnd, status, createdAt, releasedAt]
      properties:
        id:
          type: integer
          format: int64
        slot:
          type: string
          description: Environment name.
        username:
          type: string
          description: Who booked it.
        purpose:
          type: string
        start:
          type: string
          format: date-time
          description: Planned start.
        end:
          type: string
          format: date-time
          description: Planned end.
        effectiveEnd:
          type: string
          format: date-time
          description: |
            When the booking actually stopped holding the environment. Equal to
            `end`, or earlier if it was released early.
        status:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: When it was released or noticed as expired; `null` while active.
    BookingList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        meta:
          $ref: "#/components/schemas/ListMeta"
    ListMeta:
      type: object
      required: [from, to, limit, offset, total]
      properties:
        from:
          type: string
          format: date-time
          description: Resolved start of the range.
        to:
          type: string
          format: date-time
          description: Resolved (exclusive) end of the range.
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          description: Number of bookings matching the filters, across all pages.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              example: invalid_request
            message:
              type: string
              description: Human-readable explanation.
  responses:
    BadRequest:
      description: Missing or invalid parameter (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: "to must be after from"
    Unauthorized:
      description: Missing, malformed or unknown API key (`unauthorized`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: invalid API key
    Forbidden:
      description: The key is valid but lacks the required scope (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: "API key lacks required scope: bookings:read"
    MethodNotAllowed:
      description: Only `GET` is supported (`method_not_allowed`).
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Unexpected server error (`internal`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
