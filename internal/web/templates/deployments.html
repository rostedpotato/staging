<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployment history — Staging Platform</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="topbar">
    <h1>Deployment history{{if .Slot}} — {{.Slot}}{{end}}</h1>
    {{template "navlinks" .}}
  </div>
</header>
<main>
  <section class="panel">
    <form method="get" action="/deployments" class="bookform filterform">
      <label>Env
        <select name="slot" onchange="this.form.submit()">
          <option value="">All envs</option>
          {{$cur := .Slot}}
          {{range .Slots}}<option value="{{.}}" {{if eq . $cur}}selected{{end}}>{{.}}</option>{{end}}
        </select>
      </label>
      <label>Sort by
        <select name="sort" onchange="this.form.submit()">
          <option value="date_desc" {{if eq .Sort "date_desc"}}selected{{end}}>Date (newest first)</option>
          <option value="date_asc" {{if eq .Sort "date_asc"}}selected{{end}}>Date (oldest first)</option>
          <option value="slot_asc" {{if eq .Sort "slot_asc"}}selected{{end}}>Env (A–Z)</option>
          <option value="slot_desc" {{if eq .Sort "slot_desc"}}selected{{end}}>Env (Z–A)</option>
        </select>
      </label>
      <noscript><button type="submit" class="btn small">Apply</button></noscript>
    </form>
    {{template "deploytable" .Deployments}}
  </section>
</main>
</body>
</html>
